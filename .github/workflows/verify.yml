name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a superseded run on the same ref.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y imagemagick
          if command -v magick >/dev/null 2>&1; then
            magick -version
          elif command -v convert >/dev/null 2>&1; then
            convert -version
          else
            echo "No ImageMagick executable found" >&2
            exit 1
          fi

      - name: Content check
        run: npm run content:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit/component tests (Vitest)
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Static link checker
        run: npm run check:links

      - name: Playwright responsive + link suite
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7